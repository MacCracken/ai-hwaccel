name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Nothing here writes to the repository. release.yml and wheels.yml call this
# workflow, and a called workflow can only lower the token it is given.
permissions:
  contents: read

# `bash -eo pipefail`. With no shell set, GitHub runs `bash -e`, where a
# pipeline's status is its last command's alone (through 2.5.4 that let the
# test gate below pass a failing unit).
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, which a moved tag cannot
      # change (the trailing comment names the release). No step needs git
      # credentials, so none are left in .git/config for later steps to read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        run: |
          # Use the canonical installer so the layout matches what
          # `cyrius lib sync`, `cyrius deps`, and `cyriusly` expect:
          # a per-version tree under ~/.cyrius/versions/$VER/{bin,lib}/,
          # plus ~/.cyrius/current + the ~/.cyrius/{bin,lib} →
          # versions/$VER symlinks. `cyrius lib sync` (cyrius 6.0.0+)
          # copies the stdlib snapshot at ~/.cyrius/versions/$VER/lib/
          # into ./lib/. `cyrius deps` resolves only non-stdlib
          # [deps.*] git entries from 6.0.0 onward.
          #
          # The installer holds the release signing key and the tarball
          # checks, so it comes from the pinned version's tag (through 2.5.4
          # it came from cyrius's main branch), and it runs from a file: a
          # failed or cut-off download fails here instead of feeding sh
          # partial input.
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')}"
          case "$CYRIUS_VERSION" in ''|*[!0-9.]*) echo "FAIL: cyrius pin '$CYRIUS_VERSION' is not a version"; exit 1;; esac
          echo "Installing Cyrius $CYRIUS_VERSION"
          inst="$RUNNER_TEMP/cyrius-install.sh"
          curl -sSfL -o "$inst" "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh"
          CYRIUS_VERSION="$CYRIUS_VERSION" sh "$inst"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain
        run: cyrius --version

      - name: Sync stdlib into ./lib/
        # `./lib/` is gitignored — `cyrius lib sync` (cyrius 6.0.0+)
        # copies the pinned stdlib snapshot from
        # ~/.cyrius/versions/$VER/lib/ into ./lib/. Must run before any
        # compile step. (Pre-6.0.0 this was `cyrius deps`; the stdlib
        # responsibility split out of `deps` in 6.0.0.)
        run: cyrius lib sync

      - name: Resolve non-stdlib deps
        # `cyrius deps` resolves the `[deps.<name>]` git entries. Since
        # 2.3.19 there is exactly one: `[deps.bayan]`, the focused
        # `dist/bayan-json.cyr` sublib, `optional = true` and activated
        # for THIS repo by `[features] default = ["bayan"]` (a downstream
        # build that does not name `bayan` skips it entirely). This step
        # is load-bearing, not a placeholder — src/json_out.cyr's seven
        # `bayan_json_v_*` call sites do not link without it.
        run: cyrius deps

      - name: Verify dep hashes
        # `cyrius.lock` pins the bayan commit, a SHA-256 for each of the 52
        # vendored lib files, and the cyrius pin (its last line).
        #
        # A stale lock already fails the step above: since cyrius 6.6.4,
        # `cyrius deps` refuses, by name, a stdlib file whose hash disagrees
        # with the lock under an unchanged pin instead of rewriting the lock
        # to match (a bayan tag that no longer resolves to the locked commit
        # has been refused since 6.2.30). What `deps` still rewrites is the
        # lock of a pin bump, since a new pin legitimately re-locks; the
        # comparison below catches a bump committed without its re-stamped
        # lock. The lock is path-sorted since cyrius 6.6.3; the sort keeps
        # the gate independent of that.
        run: |
          cyrius deps --verify
          git show HEAD:cyrius.lock | sort > /tmp/lock.committed
          sort cyrius.lock > /tmp/lock.current
          if ! diff -u /tmp/lock.committed /tmp/lock.current; then
            echo "FAIL: cyrius.lock is stale — 'cyrius deps' produced different content."
            echo "Run 'cyrius lib sync && cyrius deps' locally and commit cyrius.lock."
            exit 1
          fi
          echo "cyrius.lock is current (52 entries, content-compared)."

      - name: Include-graph audit
        # `cyrius vet` walks every `include` from src/main.cyr and
        # reports untrusted / missing entries. Catches drift between
        # the in-tree includes and the manifest [deps] stdlib snapshot.
        # Each test unit is its own compilation root with its own include
        # list, so each is vetted too (2.5.1; only src/main.cyr was before).
        # vet exits 1 on a missing include.
        run: |
          cyrius vet src/main.cyr
          for t in tests/tcyr/*.tcyr; do
            [ -f "$t" ] || continue
            cyrius vet "$t" > /dev/null || { cyrius vet "$t"; echo "FAIL: vet $t"; exit 1; }
          done
          echo "vet: src/main.cyr and $(ls tests/tcyr/*.tcyr | wc -l) test units clean"

      - name: Capacity check
        # `--check` fails when one of the compiler's tables for the CLI's
        # compilation unit passes 85%. At 2.5.1 on cyrius 6.7.18 the largest
        # use is the fn-name hash, 1 630 of 4 096 slots.
        run: cyrius capacity --check src/main.cyr

      - name: Raw-offset guard (#derive(accessors) structs)
        # For each struct with `#derive(accessors)`, no file outside its
        # defining file may do raw `load64(<param> + N)` /
        # `store64(<param> + N, ...)` / `load64(<param>)` on it — those
        # are accessor-only surfaces. Mirrors the libro v2.6.x gate.
        #
        # Two checks (libro pattern):
        # (1) `check_struct`  — cross-file specific-struct guard. Only
        #     works when the canonical param name is unambiguous across
        #     src/ (verified by `grep -rnE 'load64\(<param> \+ [0-9]+\)'
        #     src/`).
        # (2) `check_offset_bound` — per-(file, param, struct, field
        #     count). For structs whose canonical param name is shared
        #     across files (e.g. `e` here is used by both `est` and
        #     `runtime_env`). Validates that every raw-offset site in
        #     the defining file stays within the registered struct's
        #     field range (catches off-by-one after a field-count
        #     shrink, and accidental access past the struct boundary
        #     after another struct grows).
        run: |
          FAILED=0
          check_struct() {
            local struct="$1" defining="$2" param="$3"
            local hits
            hits=$(grep -rnE "load64\($param \+ [0-9]+\)|store64\($param \+ [0-9]+|load64\($param\)" src/ 2>/dev/null \
              | grep -v "^$defining:" || true)
            if [ -n "$hits" ]; then
              echo "FAIL: raw-offset reads/writes on struct $struct outside $defining (param '$param'):"
              echo "$hits"
              echo "  → use the $struct""_* derived accessors (getters + _set_ setters)."
              FAILED=1
            fi
          }
          check_offset_bound() {
            local file="$1" param="$2" struct="$3" field_count="$4"
            local max_offset=$(( (field_count - 1) * 8 ))
            local hits
            hits=$(grep -nE "(load64|store64)\($param[ ]*\+[ ]*[0-9]+" "$file" 2>/dev/null || true)
            [ -z "$hits" ] && return 0
            while IFS= read -r line; do
              local offset
              offset=$(echo "$line" | grep -oE "\+[ ]*[0-9]+" | head -1 | grep -oE "[0-9]+")
              [ -z "$offset" ] && continue
              if [ "$offset" -gt "$max_offset" ]; then
                echo "FAIL in $file: offset +$offset on param '$param' exceeds struct '$struct' (${field_count} fields → max +$max_offset):"
                echo "  $line"
                echo "  → check the offset, the struct field count, or whether this should use the $struct""_* derived accessors."
                FAILED=1
              fi
            done <<< "$hits"
          }
          # Cross-file specific-struct guards (unambiguous param names).
          # struct       | defining file        | canonical param
          check_struct storage     src/system_io.cyr  sd
          check_struct ic          src/system_io.cyr  ic
          check_struct plan        src/system_io.cyr  sp
          check_struct shard       src/system_io.cyr  ms
          check_struct sio         src/system_io.cyr  sio
          check_struct reg         src/registry.cyr   r
          check_struct profile     src/profile.cyr    p
          check_struct cloud_inst  src/cost.cyr       ci
          check_struct rec         src/cost.cyr       rec
          check_struct lazy        src/lazy.cyr       lr
          check_struct warning     src/error.cyr      w
          check_struct targ        src/async_detect.cyr ta
          # Field-count bound checks (ambiguous params shared across
          # structs within a file or across files).
          # file                  | param | struct       | fields
          check_offset_bound src/training.cyr     e  est           4
          check_offset_bound src/system_io.cyr    e  env           8
          check_offset_bound src/model_format.cyr m  meta          5
          check_offset_bound src/model.cyr        m  model         4
          # cache.cyr: param `c` shared between `cached` (4 fields, max
          # +24) and `disk_cached` (5 fields, max +32) — register the
          # looser bound so both pass.
          check_offset_bound src/cache.cyr        c  disk_cached   5
          if [ $FAILED -ne 0 ]; then exit 1; fi
          echo "Raw-offset guard: clean (all sites use derived accessors or registered raw-offset params)."

      - name: Format check
        # cyrius fmt <file> emits the formatted source to stdout; diff
        # against the committed file to enforce no drift.
        run: |
          fail=0
          for f in src/*.cyr src/detect/*.cyr tests/tcyr/*.tcyr fuzz/*.fcyr benches/*.bcyr; do
            [ -f "$f" ] || continue
            # ⚠ Do NOT diff against `cyrius fmt`'s stdout. fmt rewrites the file
          # IN PLACE and prints nothing (`cyrius fmt` usage: "(no flag) rewrite
          # the file in place"), so the old form compared every file against an
          # empty stream and could never pass — a file cyrfmt calls FORMATTED
          # still reported drift. `--check` is the purpose-built flag: exit 1 if
          # not canonically formatted, and say where.
          if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Lint
        # `--strict` exits 2 on a warning. Plain `cyrius lint` exits 0 whatever
        # it reports, and through 2.5.0 this loop also ended in `|| true`, so
        # lint could never fail the build.
        run: |
          fail=0
          for f in src/*.cyr src/detect/*.cyr; do
            [ -f "$f" ] || continue
            cyrius lint --strict "$f" || { echo "lint: $f"; fail=1; }
          done
          [ $fail -eq 0 ] || { echo "lint: warnings found"; exit 1; }

      - name: distlib drift + determinism
        # `cyrius distlib` reads [lib].modules and emits
        # dist/ai-hwaccel.cyr — the single-file bundle library
        # consumers (mihi v0.4.0 first; see roadmap 2.2.4) pull via
        # `[deps.ai-hwaccel]`. Two invariants enforced:
        #   1. Drift: regenerate and diff against the committed
        #      bundle. Drift means src/ changed but the dist artifact
        #      wasn't refreshed — consumers would ship stale code.
        #   2. Determinism: re-run distlib and sha256-compare. Any
        #      non-determinism (timestamps, dict ordering, …) breaks
        #      the reproducible-build contract.
        # Mirrors the libro / mihi / yukti gates.
        #
        # `--no-default-features`: distlib compile-verifies the bundle's
        # `# Requires` block (cyrius 6.6.18+) with the root's features, and
        # `default = ["bayan"]` would let bayan's own `# Requires` block
        # stand in for leaves the bundle needs. A consumer without bayan
        # then fails to link (2.4.2: `file_read_all`, `getenv`, …). Verify
        # the bundle as a consumer that skips the optional dep sees it.
        run: |
          test -f dist/ai-hwaccel.cyr || { echo "FAIL: dist/ai-hwaccel.cyr missing — run 'cyrius distlib --no-default-features' and commit."; exit 1; }
          cp dist/ai-hwaccel.cyr /tmp/dist-checked-in.cyr
          cyrius distlib --no-default-features > /dev/null
          diff -q /tmp/dist-checked-in.cyr dist/ai-hwaccel.cyr \
            || { echo "FAIL: dist/ai-hwaccel.cyr is stale. Run 'cyrius distlib --no-default-features' and commit."; exit 1; }
          sha256sum dist/ai-hwaccel.cyr > /tmp/dist_a.sha
          cyrius distlib --no-default-features > /dev/null
          sha256sum dist/ai-hwaccel.cyr > /tmp/dist_b.sha
          diff -q /tmp/dist_a.sha /tmp/dist_b.sha \
            || { echo "FAIL: cyrius distlib output not deterministic across runs."; cat /tmp/dist_a.sha /tmp/dist_b.sha; exit 1; }
          echo "distlib: bundle fresh + deterministic ($(wc -l < dist/ai-hwaccel.cyr) lines)"

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/ai-hwaccel
          echo "ai-hwaccel: $(wc -c < build/ai-hwaccel) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/ai-hwaccel | grep -q "7f45 4c46"

      - name: Python bindings (unittest against the built binary)
        # Nothing ran bindings/python/tests before 2.5.5, which is how the
        # bindings' SCHEMA_VERSION stayed at 4 while the binary emitted v5
        # (2.3.15-2.3.27). detect() only warns on a schema mismatch, so
        # `-W error::UserWarning` makes one fail. The binary is also staged
        # into _bin/ the way stage_binary.sh lays it out, so the bundled-binary
        # tests run too; a skipped test fails the step.
        run: |
          bin_dir=bindings/python/src/ai_hwaccel/_bin
          mkdir -p "$bin_dir/data"
          cp build/ai-hwaccel VERSION "$bin_dir/"
          cp data/cloud_pricing.json "$bin_dir/data/"
          cd bindings/python
          AI_HWACCEL_BIN="$GITHUB_WORKSPACE/build/ai-hwaccel" \
            python3 -W error::UserWarning -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/py-tests.log"
          if grep -qE ' \.\.\. skipped |^OK \(skipped=' "$RUNNER_TEMP/py-tests.log"; then
            echo "FAIL: a Python test was skipped"; exit 1
          fi

      - name: Test suite
        # `tests/tcyr/*.tcyr` — descriptive-named test units. Each
        # `.tcyr` is a standalone compilation unit (see 2.1.0 arc).
        #
        # A unit passes when it exits 0 AND its last line is an anchored
        # "N passed, 0 failed (" summary. Through 2.5.4 the gate was
        # `tail -1 | grep -q "0 failed"` without pipefail: "10 failed"
        # contains "0 failed", and the unit's exit status (its failure count)
        # was thrown away. Each check covers a hole in the other: an exit
        # status wraps mod 256 (1280 failures exit 0), and a unit can fail
        # after printing a clean summary. Probe units try the gate first, so
        # a gate that lets a failure through fails this step.
        run: |
          unit_passed() {  # <output file> <exit status>
            [ "$2" -eq 0 ] && tail -1 "$1" | grep -qE '^[0-9]+ passed, 0 failed \('
          }
          pr="$RUNNER_TEMP/ci_probe"
          probe() {  # <failing assertions> <exit expression>; sets probe_rc
            { printf 'include "lib/%s.cyr"\n' string alloc vec str fmt assert
              printf 'alloc_init();\nvar i = 0;\nwhile (i < %s) { assert_eq(1, 2, "deliberate"); i = i + 1; }\n' "$1"
              printf 'assert_eq(1, 1, "ok");\nvar fails = assert_summary();\nsyscall(60, %s);\n' "$2"
            } > "$pr.tcyr"
            CYRIUS_DCE=1 cyrius build "$pr.tcyr" "$pr" > /dev/null
            probe_rc=0
            "$pr" > "$pr.out" 2>&1 || probe_rc=$?
          }
          for p in "10 fails" "1280 fails" "0 3"; do
            probe $p
            if unit_passed "$pr.out" "$probe_rc"; then
              echo "FAIL: the gate passes a probe unit ($p, exit $probe_rc): $(tail -1 "$pr.out")"; exit 1
            fi
          done
          probe 0 fails
          unit_passed "$pr.out" "$probe_rc" || {
            echo "FAIL: the gate fails a passing probe unit: $(tail -1 "$pr.out")"; exit 1; }
          rm -f "$pr" "$pr.tcyr" "$pr.out"
          echo "gate: rejects 10 failures, 1280 failures (exit 0) and a clean summary with exit 3"

          pass=0; fail=0
          for t in tests/tcyr/*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "=== $name ==="
            CYRIUS_DCE=1 cyrius build "$t" "$RUNNER_TEMP/ci_$name"
            rc=0
            "$RUNNER_TEMP/ci_$name" > "$RUNNER_TEMP/${name}_out" 2>&1 || rc=$?
            if unit_passed "$RUNNER_TEMP/${name}_out" "$rc"; then
              pass=$((pass + 1))
              tail -1 "$RUNNER_TEMP/${name}_out"
            else
              fail=$((fail + 1))
              echo "FAIL: $t (exit $rc)"
              tail -40 "$RUNNER_TEMP/${name}_out"
            fi
            rm -f "$RUNNER_TEMP/ci_$name"
          done
          echo "$pass passed, $fail failed"
          test $fail -eq 0

      - name: Fuzz
        run: |
          for f in fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 10 "build/$name" || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Benchmarks
        # Builds and runs the suites so they cannot rot; the timings here are
        # a shared runner's and go nowhere. bench-history.csv rows come from
        # scripts/bench-history.sh on the dev host. (Through 2.5.4 this step
        # set two env vars nothing reads, and the next step uploaded the
        # committed CSV unchanged.)
        run: |
          for f in benches/*.bcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .bcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            "build/$name"
          done

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE VERSION cyrius.cyml; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          # cyrius.cyml uses ${file:VERSION} interpolation, so VERSION
          # is the single source of truth. Assert the interpolation
          # literal is present (so cyrius resolves it correctly) and
          # the VERSION value appears in CHANGELOG.
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "FAIL: cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          grep -q "\[$FILE_VERSION\]" CHANGELOG.md || {
            echo "FAIL: version $FILE_VERSION not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION (VERSION → cyrius.cyml via \${file:VERSION})"

      - name: Verify Python bindings version
        run: |
          # The Python wheel metadata version is a literal in
          # bindings/python/pyproject.toml (setuptools can't read the
          # out-of-root VERSION file). scripts/version-bump.sh propagates
          # VERSION into it on every bump; this gate catches a bump that
          # skipped the script, the same way the distlib-drift gate does
          # for dist/ai-hwaccel.cyr. The runtime ai_hwaccel.__version__
          # derives from this via installed metadata, so pinning it here
          # pins the whole Python surface to VERSION.
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          PY_VERSION=$(sed -nE '/^\[project\]/,/^\[/{s/^version = "([^"]+)".*/\1/p}' \
            bindings/python/pyproject.toml | head -1)
          [ "$PY_VERSION" = "$FILE_VERSION" ] || {
            echo "FAIL: bindings/python/pyproject.toml version ($PY_VERSION) != VERSION ($FILE_VERSION)."
            echo "      Run scripts/version-bump.sh $FILE_VERSION (or sync the literal)."; exit 1; }
          grep -q '__version__ = _resolve_version()' \
            bindings/python/src/ai_hwaccel/__init__.py || {
            echo "FAIL: __init__.py must derive __version__ (no hardcoded literal)."; exit 1; }
          echo "Python bindings version consistent: $PY_VERSION (pyproject == VERSION; __version__ derived)"

      - name: Workflow supply-chain guard
        # 2.5.5. The release job's token can write to this repository, and
        # the toolchain the workflows install builds every shipped binary, so
        # what they run is pinned: the cyrius installer comes from the pinned
        # version's tag, every action from a full commit SHA, no checkout
        # leaves its token in .git/config, and release.yml's workflow-wide
        # token is read-only (only its release job gets contents: write).
        run: |
          if grep -nE 'cyrius/(main|master)/scripts/install\.sh' .github/workflows/*.yml; then
            echo "FAIL: fetch the cyrius installer from the pinned version's tag, not a branch"; exit 1
          fi
          if grep -nE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^.[:space:]][^@[:space:]]*@' .github/workflows/*.yml \
              | grep -vE '@[0-9a-f]{40}([[:space:]]|$)'; then
            echo "FAIL: pin every action to a full commit SHA"; exit 1
          fi
          for f in .github/workflows/*.yml; do
            co=$(grep -cE 'uses:[[:space:]]*actions/checkout@' "$f" || true)
            pc=$(grep -cE '^[[:space:]]*persist-credentials:[[:space:]]*false' "$f" || true)
            [ "$co" -eq "$pc" ] || { echo "FAIL: $f has $co checkouts but $pc 'persist-credentials: false'"; exit 1; }
          done
          awk '/^permissions:/ { p = 1; next } p && /^[^ #]/ { exit } p' .github/workflows/release.yml \
            | grep -qE '^[[:space:]]+contents:[[:space:]]*read' || {
            echo "FAIL: release.yml's top-level permissions must be contents: read"; exit 1; }
          echo "Workflows: installer and actions pinned, no persisted credentials, release token read-only."

      - name: No index install of an unpublished package
        # ai-hwaccel is not published on PyPI and the project does not own the
        # name there, so a documented `pip install ai-hwaccel` would install
        # whatever someone else uploads under it. Until wheels.yml publishes
        # the package, the docs install a wheel file.
        run: |
          if ! grep -q 'pypa/gh-action-pypi-publish' .github/workflows/wheels.yml; then
            if grep -rnE 'pip install ai-hwaccel' --include='*.md' --include='*.py' --include='*.toml' \
                README.md CONTRIBUTING.md SECURITY.md docs bindings/python; then
              echo "FAIL: the docs install ai-hwaccel by name from an index, where nothing publishes it"; exit 1
            fi
          fi
          echo "No index install line."

      - name: Wheel license text
        # setuptools reads no file outside bindings/python, so the wheel's
        # license text is a copy of the repo-root LICENSE (pyproject.toml's
        # license-files). Keep the two identical.
        run: cmp LICENSE bindings/python/LICENSE
