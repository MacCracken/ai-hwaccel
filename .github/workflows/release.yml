name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

# Read-only by default (2.5.5). Through 2.5.4 every job, the reusable CI
# gate and the build included, held contents: write while it ran the cyrius
# installer; only the release job, which creates the GitHub release, needs it.
permissions:
  contents: read

# `bash -eo pipefail` (GitHub's default `bash -e` has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, no credentials left in .git/config (see ci.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          # cyrius.cyml uses ${file:VERSION} interpolation, so VERSION
          # is the single source of truth. Assert tag == VERSION and
          # the manifest carries the interpolation literal.
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v1.0.1 == 1.0.1
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        run: |
          # Canonical installer, from the pinned version's tag and run from a
          # file (see ci.yml for rationale).
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')}"
          case "$CYRIUS_VERSION" in ''|*[!0-9.]*) echo "FAIL: cyrius pin '$CYRIUS_VERSION' is not a version"; exit 1;; esac
          echo "Installing Cyrius $CYRIUS_VERSION"
          inst="$RUNNER_TEMP/cyrius-install.sh"
          curl -sSfL -o "$inst" "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh"
          CYRIUS_VERSION="$CYRIUS_VERSION" sh "$inst"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain
        run: cyrius --version

      - name: Sync stdlib into ./lib/
        # cyrius 6.0.0+: stdlib copy split out of `cyrius deps` into
        # `cyrius lib sync`. Pulls from ~/.cyrius/versions/$VER/lib/.
        run: cyrius lib sync

      - name: Resolve non-stdlib deps
        # Fatal, as in ci.yml: src/json_out.cyr does not link without bayan
        # (through 2.5.4 a failure here was echoed away).
        run: cyrius deps

      - name: Verify dep hashes
        # cyrius.lock is committed; a release without it is not verified.
        run: cyrius deps --verify

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/ai-hwaccel
          echo "ai-hwaccel: $(wc -c < build/ai-hwaccel) bytes"

      - name: Cross-build aarch64 (best-effort)
        # Produces build/ai-hwaccel-aarch64 when the toolchain bundle
        # includes cycc_aarch64 (legacy name cc5_aarch64; kept as a
        # symlink under cyrius 6.0.0). Archive step ships both x86 +
        # aarch64 binaries when present.
        run: |
          if [ -x "$HOME/.cyrius/bin/cycc_aarch64" ] || [ -x "$HOME/.cyrius/bin/cc5_aarch64" ]; then
            CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/ai-hwaccel-aarch64
            echo "ai-hwaccel-aarch64: $(wc -c < build/ai-hwaccel-aarch64) bytes"
          else
            echo "::warning::cycc_aarch64 not in toolchain — aarch64 binary skipped in release"
          fi

      - name: Smoke test
        # Runs the binary this job ships. Through 2.5.4 both lines ended in
        # `|| true`, so a binary that crashed at startup was still published,
        # and detection never ran. The aarch64 binary runs in smoke-aarch64.
        run: |
          want="$(tr -d '[:space:]' < VERSION)"
          got="$(./build/ai-hwaccel --version | tr -d '[:space:]')"
          test "$got" = "$want" || { echo "FAIL: --version printed '$got', VERSION is $want"; exit 1; }
          ./build/ai-hwaccel --help > /dev/null
          ./build/ai-hwaccel | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert isinstance(d["schema_version"], int), "no schema_version"
          assert d["profiles"], "empty profiles[]"
          print("OK schema_version=%d profiles=%d" % (d["schema_version"], len(d["profiles"])))
          '
          ./build/ai-hwaccel --summary | python3 -c 'import json, sys; json.load(sys.stdin)'
          if [ -f build/ai-hwaccel-aarch64 ]; then
            # e_machine (ELF offset 18) 0xb7: the cross build is AArch64.
            test "$(xxd -s 18 -l 2 -p build/ai-hwaccel-aarch64)" = b700 \
              || { echo "FAIL: build/ai-hwaccel-aarch64 is not an AArch64 ELF"; exit 1; }
          fi

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="ai-hwaccel-${TAG}/" -o "ai-hwaccel-${TAG}-src.tar.gz" HEAD
          if [ -f build/ai-hwaccel ]; then
            cp build/ai-hwaccel "ai-hwaccel-${TAG}-x86_64-linux"
          fi
          if [ -f build/ai-hwaccel-aarch64 ]; then
            cp build/ai-hwaccel-aarch64 "ai-hwaccel-${TAG}-aarch64-linux"
          fi
          sha256sum ai-hwaccel-*.tar.gz ai-hwaccel-*-linux 2>/dev/null > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            ai-hwaccel-*.tar.gz
            ai-hwaccel-*-linux
            cyrius.lock
            SHA256SUMS

  smoke-aarch64:
    name: aarch64 runtime smoke
    # 2.5.5: the release shipped an aarch64 binary that no job had run. This
    # one runs it natively on an arm64 runner before the release is created.
    needs: [build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: artifacts
      - name: Run the shipped aarch64 binary
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          bin="artifacts/ai-hwaccel-${TAG}-aarch64-linux"
          if [ ! -f "$bin" ]; then
            echo "::warning::no aarch64 binary in this release (the cross build was skipped); nothing to run"
            exit 0
          fi
          chmod +x "$bin"   # artifacts do not keep the mode bits
          want="$(tr -d '[:space:]' < VERSION)"
          got="$("$bin" --version | tr -d '[:space:]')"
          test "$got" = "$want" || { echo "FAIL: --version printed '$got', VERSION is $want"; exit 1; }
          "$bin" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert isinstance(d["schema_version"], int), "no schema_version"
          assert d["profiles"], "empty profiles[]"
          print("OK schema_version=%d profiles=%d" % (d["schema_version"], len(d["profiles"])))
          '

  release:
    name: Create GitHub Release
    needs: [build, smoke-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that writes: it creates the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
      - name: Changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "ai-hwaccel ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            ai-hwaccel-*.tar.gz
            ai-hwaccel-*-linux
            cyrius.lock
            SHA256SUMS
