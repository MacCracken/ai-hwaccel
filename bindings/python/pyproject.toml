[build-system]
# 77: the SPDX `license` string and `license-files` (PEP 639). The table form
# and the License classifier this used through 2.5.4 are deprecated, and
# setuptools stops accepting them after 2027-02-18.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hwaccel"
# Single version source is the repo-root VERSION file (same as
# cyrius.cyml's ${file:VERSION}). setuptools cannot read a file outside
# the project root, so this literal is *propagated* from VERSION by
# scripts/version-bump.sh on every bump and gated in CI (the "python
# bindings version" step in .github/workflows/ci.yml asserts it equals
# VERSION). Runtime `ai_hwaccel.__version__` derives from this via the
# installed wheel metadata — see src/ai_hwaccel/__init__.py.
version = "2.5.5"
description = "Universal AI hardware accelerator detection — Python bindings"
readme = "README.md"
# setuptools 75.4 and later need Python 3.9, and this file needs setuptools
# 77 (above), so a source install cannot work on 3.8; the wheels say the same.
requires-python = ">=3.9"
license = "GPL-3.0-only"
# The wheel ships a GPL-3.0 binary, so its .dist-info/licenses/ carries the
# license text. setuptools reads no file outside the project root, so
# bindings/python/LICENSE is a copy of the repo-root LICENSE; CI checks that the
# two match.
license-files = ["LICENSE"]
authors = [{ name = "Robert MacCracken" }]
keywords = ["gpu", "cuda", "rocm", "tpu", "accelerator", "hardware", "detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/MacCracken/ai-hwaccel"
Repository = "https://github.com/MacCracken/ai-hwaccel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Per-platform binary + its data files, staged by scripts/stage_binary.sh
# and bundled into the platform wheel (2.3.4). Empty in the pure-source
# install — the runner falls back to PATH / AI_HWACCEL_BIN.
ai_hwaccel = ["_bin/ai-hwaccel", "_bin/ai-hwaccel.exe", "_bin/VERSION", "_bin/data/*"]
